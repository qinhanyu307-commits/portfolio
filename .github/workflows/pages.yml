name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate
        run: |
          set -euo pipefail
          npm run build
          node scripts/test-content.mjs
          node scripts/test-pages.mjs
          node scripts/test-home.mjs
          npm run check
          python3 -m unittest discover -s scripts -p 'test_wait_pages_artifact.py'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: upload_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for uploaded package metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload_pages.outputs.artifact_id }}
        run: python3 scripts/wait_pages_artifact.py
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify published pages and scripts
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, urllib.parse, hashlib, pathlib
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          paths = ['index.html', 'content/projects.json', 'admin/index.html', '_next/static/chunks/app/layout-6d0f10cc5e82d4d4.js']
          for path in paths:
              expected = pathlib.Path('docs', path).read_bytes()
              for attempt in range(12):
                  try:
                      url = urllib.parse.urljoin(base, path) + '?verify=' + os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url, timeout=30) as response:
                          actual = response.read()
                      if actual != expected:
                          raise RuntimeError('Published file does not yet match this build')
                      print('Verified HTTP 200 and build content: ' + path)
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
          PY
